name: Update ISD Dependencies Ehub

on:
  push:
    branches:
      - ehub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy isd_dependencies to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EHUB_HOST }}
        username: ${{ secrets.EHUB_USERNAME }}
        key: ${{ secrets.EHUB_SSH_KEY }}
        script_stop: true
        script: |
          # This repo is not an Odoo module: it has no __manifest__.py and
          # nothing to copy into custom-addons. It exists to pin the Python
          # libraries the other modules import, so the checkout stays in
          # addons-system and only requirements.txt is acted on.
          if [ ! -d /opt/addons-system/isd_dependencies ]; then
            sudo mkdir -p /opt/addons-system
            sudo chown odoo:odoo /opt/addons-system
            sudo -u odoo git clone git@github-odoo:IntelliSync-data/isd_dependencies.git /opt/addons-system/isd_dependencies
            sudo -u odoo bash -c "cd /opt/addons-system/isd_dependencies && git checkout ehub"
          else
            # ubuntu may only run git as the odoo user, which owns these files
            sudo -u odoo bash -c "cd /opt/addons-system/isd_dependencies && git fetch origin && git reset --hard origin/ehub"
          fi

    - name: Install Python Dependencies
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EHUB_HOST }}
        username: ${{ secrets.EHUB_USERNAME }}
        key: ${{ secrets.EHUB_SSH_KEY }}
        script_stop: true
        script: |
          sudo -u odoo /opt/odoo-venv/bin/pip install --no-input \
            -r /opt/addons-system/isd_dependencies/requirements.txt

    - name: Restart Odoo Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EHUB_HOST }}
        username: ${{ secrets.EHUB_USERNAME }}
        key: ${{ secrets.EHUB_SSH_KEY }}
        script: |
          sudo systemctl restart odoo

    - name: Verify Odoo Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EHUB_HOST }}
        username: ${{ secrets.EHUB_USERNAME }}
        key: ${{ secrets.EHUB_SSH_KEY }}
        script: |
          sleep 5
          if sudo systemctl is-active --quiet odoo; then
            echo "Odoo restarted successfully"
          else
            echo "Odoo failed to restart"
            echo "=== systemctl status ==="
            sudo systemctl status odoo --no-pager
            echo "=== Last 50 lines of Odoo log ==="
            sudo tail -n 50 /var/log/odoo/odoo.log
            exit 1
          fi
